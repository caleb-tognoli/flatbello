name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Ubuntu 26.04 ships OCCT 7.9 (TKDE* toolkits); 24.04 ships 7.6 (the older TKSTEP/TKIGES names).
    name: fmt, clippy, test (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:26.04", "ubuntu:24.04"]
    steps:
      - name: Install OCCT and Rust
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates curl git \
            libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-data-exchange-dev rustup \
            mesa-vulkan-drivers libvulkan1
          rustup default stable
          rustup component add rustfmt clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.image }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  # Windows and macOS are new: they report but do not block until they have run green.
  macos:
    name: macOS (Homebrew OCCT)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v5
      - run: brew install opencascade
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  windows:
    name: Windows (vcpkg OCCT)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 240
    env:
      VCPKG_TRIPLET: x64-windows-release
    steps:
      - uses: actions/checkout@v5
      - name: Locate vcpkg
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          $occt = "$root\installed\$env:VCPKG_TRIPLET"
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "OCCT_INCLUDE_DIR=$occt\include\opencascade" >> $env:GITHUB_ENV
          "OCCT_LIB_DIR=$occt\lib" >> $env:GITHUB_ENV
          "$occt\bin" >> $env:GITHUB_PATH
      # Building OCCT takes a long time. The installed tree is cached right after the build,
      # so that a later failure in this job does not throw the build away.
      - id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_ROOT }}\installed
          key: vcpkg-opencascade-${{ env.VCPKG_TRIPLET }}-v1
      - name: Install OCCT
        if: steps.occt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: '& "$env:VCPKG_ROOT\vcpkg.exe" install "opencascade:$env:VCPKG_TRIPLET"'
      - if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_ROOT }}\installed
          key: vcpkg-opencascade-${{ env.VCPKG_TRIPLET }}-v1
      - name: List OCCT toolkits
        shell: pwsh
        run: Get-ChildItem $env:OCCT_LIB_DIR -Filter "TK*.lib" | Select-Object -ExpandProperty Name
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  deny:
    name: licenses, bans, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

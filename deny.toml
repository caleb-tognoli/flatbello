# cargo-deny configuration: `cargo deny check licenses bans sources`.

[graph]
all-features = true

[licenses]
# Anything not listed here is rejected. GPL and AGPL are never allowed.
# Adding a license here needs approval (see the dependency policy).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.93
# The allow list covers future dependencies too; unused entries are expected.
unused-allowed-license = "allow"

[licenses.private]
# Flatbello's own crates are unpublished and their license is not decided yet.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Banned by the dependency policy: async runtimes, serde, anyhow, thiserror.
    { crate = "tokio" },
    { crate = "async-std" },
    { crate = "serde" },
    { crate = "anyhow" },
    { crate = "thiserror" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

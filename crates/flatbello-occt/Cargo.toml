[package]
name = "flatbello-occt"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Fixture-only shim functions (build solids, write STEP/STL). Used by tools/gen-fixtures.
fixtures = []

[dependencies]
flatbello-core.workspace = true

[build-dependencies]
cc = { version = "1.2", default-features = false }

# Mirrors [workspace.lints] except `unsafe_code`: this is the only crate allowed to use unsafe.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
float_cmp = "warn"
undocumented_unsafe_blocks = "deny"
